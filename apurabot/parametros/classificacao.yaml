# Classificação da operação.
#
# Ordem de avaliação: a primeira regra que casar vence. O que não casar em
# nenhuma vira status SEM REGRA e bloqueia o encerramento da competência —
# nunca é classificado por adivinhação.

# ---------------------------------------------------------------------------
# 1. Relevância para ICMS
# ---------------------------------------------------------------------------
relevancia_icms:
  cst_com_icms: ["00", "20", "90"]
  cst_sem_icms: ["40", "41", "50", "51", "60"]
  exige_icms_diferente_de_zero: true
  excluir_documento_cancelado: true          # coluna AF preenchida

# ---------------------------------------------------------------------------
# 2. Lançamentos sem valor contábil — carga indeterminável por fórmula
#    Estas linhas têm ICMS diferente de zero e valor contábil zero, então
#    ICMS ÷ valor contábil não existe. A carga vem daqui, não do cálculo.
# ---------------------------------------------------------------------------
lancamentos_sem_contabil:
  - produto: 615000001
    cfop: [1604]
    categoria: ciap
    carga_efetiva: CIAP
    descricao: Lançamento de crédito relativo à compra de bem para o ativo imobilizado

  - produto: 701000075
    categoria: complemento_icms
    carga_efetiva: 4.0
    descricao: Complemento de ICMS
    homologado: true
    # Regra, não acaso — confirmado em 21/08/2026. O complemento acompanha a
    # situação da nota complementada, como o complemento de preço. Os 4,0% são
    # a carga das notas que o complemento complementa. Se um complemento vier
    # de nota com outra carga,
    # é a carga dela que vale, e a referência está na coluna Observação.

  - sem_valor_contabil: true
    categoria: complemento_icms
    carga_efetiva: 4.0
    descricao: Complemento de ICMS lançado contra o código do produto
    homologado: true
    # Confirmado pela Gerência Fiscal em 01/09/2026.
    #
    # Nem todo complemento vem no código de produto próprio (701000075): há
    # complemento lançado contra o código da mercadoria complementada. O que
    # não muda é a FORMA — sem valor contábil, só com base e valor de ICMS —,
    # e é por ela que este item reconhece.
    #
    # A forma só alcança o que sem ela seria pendência `SEM BASE`: um
    # lançamento com valor contábil nunca casa aqui. Por isso a regra não pode
    # alargar nada — só deixa de barrar o que já se sabe o que é.

# ---------------------------------------------------------------------------
# 3. Exceções por CFOP — têm precedência sobre tudo
# ---------------------------------------------------------------------------
excecoes_cfop:
  - cfop: [5927]
    categoria: quebra
    regra: estorna_100_credito_entrada
    descricao: Baixa de estoque por perda, roubo ou deterioração
  - cfop: [5556, 6556]
    categoria: devolucao_uso_consumo
    regra: estorna_credito_da_compra
  - cfop: [1201, 1202, 2201, 2202]
    categoria: devolucao_venda
    regra: mantem_100
  - cfop: [1410, 1411, 2410, 2411]
    categoria: devolucao_compra
    regra: estorna_credito_da_compra
  - cfop: [1902, 1903, 2902, 2903, 1906, 2906]
    categoria: retorno_industrializacao
    regra: mantem_100

# ---------------------------------------------------------------------------
# 4. Fretes — a finalidade vem na descrição do CT-e (coluna R)
# ---------------------------------------------------------------------------
fretes:
  identificacao:
    especie_documento: CT
    modelo_documento: "57"

  # Avaliadas EM ORDEM, primeira que casar vence. O texto é procurado dentro
  # da descrição do produto/serviço (coluna R), sem diferenciar maiúsculas.
  # As mais específicas vêm primeiro: "Fretes sobre Compra Revenda" precisa
  # ser testada antes de "Fretes sobre Compra".
  finalidades:
    - contem: "Fretes sobre Compra Revenda"
      categoria: frete_compra_revenda
    - contem: "Fretes sobre Compra de Insumos"
      categoria: frete_compra
    - contem: "Fretes sobre Compras (Almoxarifado)"
      categoria: frete_compra
    - contem: "Fretes sobre Transf/ Retorno - Venda conjunta"
      categoria: frete_transferencia
    - contem: "Fretes sobre Transf/ Remessa/ Retorno"
      categoria: frete_transferencia
    - contem: "Fretes sobre Vendas"
      categoria: frete_venda

  # Usado quando a descrição não casar com nenhuma finalidade acima.
  fallback_cfop:
    frete_compra: [1352, 2352, 1353, 2353]
    frete_venda: [5352, 6352, 5353, 6353]

  sem_correspondencia: SEM_REGRA

# ---------------------------------------------------------------------------
# 5. Mercadorias — prefixo do código do produto (coluna Q)
#    Default por prefixo; o cadastro em produtos.yaml sobrepõe caso a caso.
# ---------------------------------------------------------------------------
prefixo_produto:
  "1": materia_prima          # produtos e insumos
  "2": embalagem              # big bags, sacos, lapelas
  "6": ativo_imobilizado      # CIAP
  "7": frete                  # serviços de transporte

# CFOPs que, independentemente do produto, indicam revenda
cfop_revenda: [1102, 2102, 1113, 2113]
# CFOPs de compra para industrialização
cfop_industrializacao: [1101, 2101, 3101]

# ---------------------------------------------------------------------------
# 6. DIFAL — itens fora do processo produtivo usam o ICMS do XML
#    Ver decisão pendente nº 2.
# ---------------------------------------------------------------------------
difal:
  cfop_uso_consumo: [1556, 2556]
  cfop_ativo: [1551, 2551]
  fonte_do_icms: xml_da_nota
  nunca_sobrescrever_livro: true
