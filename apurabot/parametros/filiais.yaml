# Cadastro de estabelecimentos.
# O casamento é feito pelo CODIGO da empresa (coluna G do Livro Fiscal),
# nunca pelo nome — os nomes têm espaçamento irregular na origem.
#
# `cnpj` e `inscricao_estadual` aparecem no cabeçalho do Registro de Apuração.
# Onde estiverem em branco, o registro sai com o campo marcado como não
# cadastrado — preencha com o que consta no cadastro da filial.
#
# Revisão: Gerência Fiscal/Tributária | Vigência: a partir de 2026-01-01

filiais:
  - codigo: 1
    nome: HINOVE (MATRIZ)
    uf: SP
    regime: sp_equilibrio_fiscal
    centralizacao: { participa: true, papel: centralizado }

  - codigo: 2
    nome: HINOVE (RIO BRILHANTE)
    uf: MS
    cnpj: "14031191000244"
    inscricao_estadual: "284280330"
    regime: ms_beneficio_rio_brilhante
    beneficio_fiscal: ms_rio_brilhante        # Termo de Acordo
    centralizacao: { participa: true, papel: centralizadora }

  # ATENÇÃO: códigos abaixo a confirmar na extração do Sankhya.
  # Julho/2026 só expôs os códigos 1 e 2 nas linhas amostradas.
  - codigo: null
    nome: HINOVE (REGISTRO)
    uf: SP
    regime: sp_equilibrio_fiscal
    centralizacao: { participa: true, papel: centralizado }

  - codigo: null
    nome: HINOVE (FILIAL GUARÁ)
    uf: SP
    regime: sp_equilibrio_fiscal
    centralizacao: { participa: true, papel: centralizadora }

  - codigo: null
    nome: HINOVE (CORUMBÁ- MS)
    uf: MS
    regime: ms_estorno_proporcional
    centralizacao: { participa: true, papel: centralizado }

  - codigo: null
    nome: HINOVE (BARRA DO GARÇAS - MT)
    uf: MT
    regime: mt_diferimento
    centralizacao: { participa: false }

  - codigo: null
    nome: HINOVE (LONDRINA)
    uf: PR
    regime: pr_diferimento
    centralizacao: { participa: false }

# ---------------------------------------------------------------------------
# Regras de centralização
# ---------------------------------------------------------------------------
# Onde a UF admite apuração centralizada, cada estabelecimento apura o seu saldo
# e o transfere para a centralizadora, que consolida o resultado do grupo. Quem
# é centralizadora e quem é centralizado está no bloco `filiais`, acima.
#
# `transfere` diz o que o centralizado passa adiante:
#   saldo_integral   devedor e credor
#   saldo_devedor    só quando deve
#   saldo_credor     só quando tem crédito
#
# `mecanismo` diz como a transferência se formaliza:
#   nfe                 NF-e emitida pelo estabelecimento centralizado
#   ajuste_de_apuracao  lançamento no Registro de Apuração, sem documento próprio
#
# `cfop_transferencia` são os CFOP sugeridos para a NF-e, quando o mecanismo é
# `nfe`. A ferramenta não cobra esse documento dentro da competência apurada: a
# nota nasce do resultado da apuração e só existe depois do encerramento. O que
# a ferramenta emite é a instrução do que transferir.
regras_de_centralizacao:

  sp:
    uf: SP
    transfere: saldo_integral
    mecanismo: nfe
    cfop_transferencia: [5601, 5602, 5605]
    homologado: false
    # NÃO HOMOLOGADA. O desenho vem do escopo funcional v1.0; falta a Gerência
    # Fiscal/Tributária confirmar o que se transfere e por qual CFOP.
    # Ver decisão pendente nº 11.

  ms:
    uf: MS
    transfere: saldo_devedor
    mecanismo: ajuste_de_apuracao
    homologado: true
    # Em MS a transferência não tem documento fiscal próprio: entra como
    # "Recebimento de saldo devedor - estabelecimento centralizador" na linha
    # 002 do Registro de Apuração da centralizadora.
    #
    # ATENÇÃO: só o saldo devedor está evidenciado. Não há competência
    # observada em que o estabelecimento centralizado tenha apurado saldo
    # credor, então o que se faz nesse caso segue em aberto — ver decisão
    # pendente nº 7.

# Fora do escopo do Apurabot — carregam apenas saldo credor.
# Ver decisão pendente nº 10.
fora_de_escopo:
  - { nome: MICROBIO, uf: MS }
  - { nome: HINOVE FERTILIZANTES ESPECIAIS, uf: SP }
