# Cadastro de produtos → categoria tributária.
#
# 829 produtos distintos em Julho/2026. Este arquivo guarda o que o padrão por
# prefixo (classificacao.yaml) não resolve. Produto novo sem categoria e sem
# prefixo conhecido vira pendência SEM REGRA — nunca classificação por
# adivinhação.
#
# `homologado: false` marca a categoria que eu inferi da apuração de Julho/2026
# e que ainda não foi confirmada pela Gerência Fiscal/Tributária.
#
# PRIORIDADE DE CADASTRO: os 14 produtos abaixo são os únicos que aparecem em
# ENTRADAS com carga acima de 4% na competência 07/2026 — ou seja, os únicos em
# que a categoria muda o valor do estorno. Os demais 815 produtos entram a 4% ou
# em saídas, onde a categoria não altera o resultado.

produtos:

  # --- fretes: a finalidade já vem na descrição do CT-e ---
  700000001: { categoria: frete_venda,         descricao: Fretes sobre Vendas }
  700000002: { categoria: frete_transferencia, descricao: "Fretes sobre Transf/ Remessa/ Retorno (Custo)" }
  700000003: { categoria: frete_compra,        descricao: "Fretes sobre Compra de Insumos (Custo)" }
  701000177: { categoria: frete_transferencia, descricao: "Fretes sobre Transf/ Retorno - Venda conjunta" }

  # --- serviço de industrialização por terceiros ---
  # O prefixo 7 o classificaria como frete, o que ele não é.
  702000073:
    categoria: industrializacao_terceiros
    descricao: Ind. / Ensaque 1.000 Kg Multitrans
    homologado: false

  # --- revenda: mantém o crédito integral ---
  110010150:
    categoria: revenda
    descricao: Enxofre em Flocos Brimfert Granel
    observacao: >
      Confirmado pela apuração manual de Julho/2026 — a aba ESTORNO traz
      "Enxofre - Revenda" com estorno zero sobre R$ 474.416,28 de ICMS a 18%.

  # --- produtos químicos: estornam o excedente sobre 4% ---
  130030002:
    categoria: produto_quimico
    descricao: ÁCIDO FOSFÓRICO RAFINADO
    homologado: false
  132010068:
    categoria: produto_quimico
    descricao: MAX OIL MT - Aditivo Recobrimento Granel
    homologado: false
  132010008:
    categoria: produto_quimico
    descricao: NBPT BLUE 20%
    observacao: >
      Confirmado em 21/08/2026 conferindo onde o produto entrou na apuração de
      Julho/2026. Em Corumbá, a Empresa 9 estorna a linha de CFOP 2102 pelos
      42,86% da carga de 7% (R$ 2.520,17 de estorno sobre R$ 5.880,00 de ICMS),
      ou seja, trata como crédito comum sujeito ao estorno — não como revenda
      com crédito integral. Em Guará, a mesma compra entra no grupo de 12% que
      estornou 8%. Os dois tratamentos batem com produto_quimico.

  # --- insumo energético ---
  401052046:
    categoria: insumo_energetico
    descricao: CAVACO DE MADEIRA
    homologado: false
    observacao: >
      A aba ESTORNO lista "Cavaco" entre os itens do grupo de 12% de Guará que
      estornou, então o tratamento observado é o mesmo de produto químico.

  # --- embalagens: estornam o excedente sobre 4% ---
  # Todas com prefixo 2, já cobertas pelo padrão. Ficam explícitas porque
  # entram com CFOP de compra para industrialização, que confundiria a leitura.
  201000007: { categoria: embalagem, descricao: BIG BAG 100X100X140 C/ LINER V/V 190Gr }
  201000021: { categoria: embalagem, descricao: BIG BAG PCR HiPhós NPK 90X90X140 C/ LINER }
  201000024: { categoria: embalagem, descricao: BIG BAG PCR HiPhós 90X90X110 C/ LINER V/V }
  202000998: { categoria: embalagem, descricao: SACO VVD PEBD HINOVE HiSol NPK 25 KG }
  401004996:
    categoria: embalagem
    descricao: LACRE DE SEGURANÇA PP - 30 CM - AZUL
    homologado: false

  # --- ativo imobilizado / CIAP ---
  606000001: { categoria: ativo_imobilizado, descricao: MAQUINAS E EQUIPAMENTOS }

  # --- complemento de preço ---
  401002106:
    categoria: complemento_preco
    descricao: COMPLEMENTO DE PREÇO
    observacao: >
      Acompanha a situação da nota complementada — decisão de 21/08/2026.
      Na prática o documento já sai com a base reduzida da operação original,
      então a carga calculada é a da nota complementada: em Julho/2026 as 22
      linhas saíram com alíquota de 7% sobre base reduzida, dando carga efetiva
      de 4%, que é a carga de uma saída de matéria-prima. A observação do
      documento traz a referência ("COMPLEMENTO DE PREÇO REFERENTE A NF <nº>"),
      e é por ela que a memória de cálculo liga o complemento à nota original.
