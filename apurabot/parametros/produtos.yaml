# Cadastro de produtos → categoria tributária.
#
# Guarda o que o padrão por prefixo (classificacao.yaml) não resolve. Produto sem
# categoria e sem prefixo conhecido vira pendência SEM REGRA — nunca
# classificação por adivinhação.
#
# `homologado: false` marca a categoria inferida do comportamento de uma apuração
# e ainda não confirmada pela Gerência Fiscal/Tributária.
#
# Só precisa de cadastro o produto que entra com carga acima de 4%: é nele que a
# categoria muda o valor do estorno. Entrada a 4% e saída não dependem dela.
#
# ---------------------------------------------------------------------------
# MATÉRIA-PRIMA × PRODUTO QUÍMICO
# ---------------------------------------------------------------------------
# A distinção não é sobre o que o produto é quimicamente — produto químico
# também é matéria-prima. O que separa os dois é o ENQUADRAMENTO FISCAL:
#
#   materia_prima    matéria-prima enquadrada no artigo de equalização da carga
#                    a 4% (benefício de fertilizante). NÃO estorna.
#   produto_quimico  matéria-prima que NÃO se enquadra nesse artigo.
#                    Estorna o excedente sobre 4%.
#
# Uma matéria-prima deixa de se enquadrar por dois motivos:
#   1. o produto está fora do escopo do artigo de fertilizante; ou
#   2. o fornecedor não tem registro no MAPA para vendê-lo como enquadrado —
#      tipicamente indústria química, e não fabricante de fertilizante.
#
# O motivo 2 é a razão de o cadastro aceitar chave por PRODUTO + FORNECEDOR: o
# mesmo produto pode ser matéria-prima de um fornecedor e produto químico de
# outro. A forma é uma lista, com as alternativas específicas antes do padrão:
#
#   130030002:
#     - fornecedor: NOME DA INDUSTRIA QUIMICA
#       categoria: produto_quimico
#     - categoria: materia_prima        # sem `fornecedor` = padrão do produto
#
# Um produto cadastrado SÓ com regras por fornecedor, quando nenhuma casa, vira
# pendência — não cai num padrão silencioso.
#
# O fato que decide (enquadramento e registro no MAPA) não está no Livro Fiscal.
# É informação cadastral do time fiscal, e por isso vive aqui.

produtos:

  # --- fretes: a finalidade já vem na descrição do CT-e ---
  700000001: { categoria: frete_venda,         descricao: Fretes sobre Vendas }
  700000002: { categoria: frete_transferencia, descricao: "Fretes sobre Transf/ Remessa/ Retorno (Custo)" }
  700000003: { categoria: frete_compra,        descricao: "Fretes sobre Compra de Insumos (Custo)" }
  701000177: { categoria: frete_transferencia, descricao: "Fretes sobre Transf/ Retorno - Venda conjunta" }

  # --- serviço de industrialização por terceiros ---
  # O prefixo 7 o classificaria como frete, o que ele não é.
  702000073:
    categoria: industrializacao_terceiros
    descricao: Ind. / Ensaque 1.000 Kg Multitrans
    homologado: false

  # --- revenda: mantém o crédito integral ---
  110010150:
    categoria: revenda
    descricao: Enxofre em Flocos Brimfert Granel
    observacao: >
      Importação com finalidade de revenda. A TOP da entrada nomeia a operação
      pela moeda ("Compra com Moeda Importação"), o que descreve o lançamento e
      não o enquadramento — quem decide é a finalidade, e ela é revenda.
      Categoria confirmada pela Gerência Fiscal/Tributária.

  # --- produtos químicos: matéria-prima não enquadrada, estorna sobre 4% ---
  #
  # Categoria confirmada pela Gerência Fiscal/Tributária: onde a TOP da entrada
  # diz "Compra de MP" e o cadastro diz produto químico, vale o cadastro. Não é
  # contradição — é matéria-prima que não se enquadra no artigo.
  #
  # FALTA CONFIRMAR, por item: se o não enquadramento vem do produto (motivo 1)
  # ou do fornecedor (motivo 2). Enquanto não se sabe, o cadastro é por produto.
  # Se for do fornecedor, basta passar a entrada para a forma de lista.
  130030002:
    categoria: produto_quimico
    descricao: ÁCIDO FOSFÓRICO RAFINADO
    fornecedor_observado: ICL ADITIVOS E INGREDIENTES LTDA
    observacao: >
      O mesmo fornecedor também vende item classificado como matéria-prima
      (HiPhós 21 TQ Granel), então o não enquadramento deste produto não pode
      ser atribuído ao fornecedor sem confirmação.
  132010068:
    categoria: produto_quimico
    descricao: MAX OIL MT - Aditivo Recobrimento Granel
    fornecedor_observado: ADFERT (INDORAMA)
  132010008:
    categoria: produto_quimico
    descricao: NBPT BLUE 20%
    fornecedor_observado: NAQ GLOBAL QUIMICA FERTILIZANTES
    observacao: >
      Tratado como crédito comum sujeito ao estorno, e não como revenda com
      crédito integral, tanto em Corumbá (estorno pela parcela da alíquota de
      7%) quanto em Guará (grupo de 12%). Os dois tratamentos batem com
      produto_quimico.

  # --- insumo energético ---
  401052046:
    categoria: insumo_energetico
    descricao: CAVACO DE MADEIRA
    homologado: false
    observacao: >
      Tratamento observado igual ao de produto químico: estorna o excedente
      sobre a carga de referência.

  # --- embalagens: estornam o excedente sobre 4% ---
  # Todas com prefixo 2, já cobertas pelo padrão. Ficam explícitas porque
  # entram com CFOP de compra para industrialização, que confundiria a leitura.
  201000007: { categoria: embalagem, descricao: BIG BAG 100X100X140 C/ LINER V/V 190Gr }
  201000021: { categoria: embalagem, descricao: BIG BAG PCR HiPhós NPK 90X90X140 C/ LINER }
  201000024: { categoria: embalagem, descricao: BIG BAG PCR HiPhós 90X90X110 C/ LINER V/V }
  202000998: { categoria: embalagem, descricao: SACO VVD PEBD HINOVE HiSol NPK 25 KG }
  401004996:
    categoria: embalagem
    descricao: LACRE DE SEGURANÇA PP - 30 CM - AZUL
    homologado: false

  # --- ativo imobilizado / CIAP ---
  606000001: { categoria: ativo_imobilizado, descricao: MAQUINAS E EQUIPAMENTOS }

  # --- complemento de preço ---
  401002106:
    categoria: complemento_preco
    descricao: COMPLEMENTO DE PREÇO
    observacao: >
      Acompanha a situação da nota complementada. Na prática o documento já sai
      com a base reduzida da operação original, então a carga calculada é a da
      nota complementada. A observação do documento traz a referência
      ("COMPLEMENTO DE PREÇO REFERENTE A NF <nº>"), e é por ela que a memória de
      cálculo liga o complemento à nota original.
