# Regimes de apuração por UF.
# RASCUNHO — pendente de homologação da Gerência Fiscal/Tributária.
# Fonte: aba "Pontos de Atenção" da apuração de Julho/2026 + escopo funcional v1.0.

regimes:

  sp_equilibrio_fiscal:
    descricao: >
      Mantém o crédito até a carga de saída e estorna o excedente.
      estorno = valor_contabil × (carga_efetiva_entrada − carga_saida_referencia)
    vigencia_inicio: 2025-01-01
    formula_estorno: excedente_sobre_carga_saida
    carga_saida_referencia: 4.0
    base_do_estorno: valor_contabil        # confirmado contra Julho/2026
    isentos_de_estorno:
      - materia_prima
      - produto_acabado
      - revenda
      - retorno_industrializacao
      - ciap
      - complemento_icms
      - devolucao_venda
    frete_venda_intraestadual: sem_credito # diferido/isento
    difal: conta_grafica

  ms_estorno_proporcional:
    descricao: >
      Estorno da parcela não tributada da operação: o crédito é reduzido até a
      carga de 4%, aplicando o percentual de redução sobre o VALOR DO ICMS.
      Não é a mecânica de SP — lá o estorno incide sobre o valor contábil.
      Confirmado contra a apuração individualizada de Corumbá (Empresa 9),
      aba ENTRADAS, colunas "Parcela não tributada" e "Valor ICMS a estornar".
    vigencia_inicio: 2025-01-01
    formula_estorno: proporcional_parcela_nao_tributada
    base_do_estorno: valor_icms

    # Percentual da operação que não é tributado, por carga efetiva da entrada.
    # É a coluna "REDUÇÃO ATUAL" da tabela de operação interestadual, e o que
    # sobra leva a carga a 4%: 12% × (1 − 0,6667) = 4,00% · 7% × (1 − 0,4286) = 4,00%.
    #
    # ATENÇÃO: são os percentuais ARREDONDADOS em 4 casas, e não as frações
    # exatas (2/3 e 3/7). É o que a apuração de Julho/2026 usou, e a escolha
    # vale R$ 1,04 em Corumbá. Ver decisão pendente nº 15.
    parcela_nao_tributada:
      4.0: 0.0
      7.0: 0.4286
      12.0: 0.6667

    # Créditos que não podem ser apropriados. Não são estorno: são crédito que
    # nunca existiu, e por isso ficam em coluna própria na apuração.
    creditos_indevidos:
      - cfop: [2152]
        motivo: >
          Transferência interestadual recebida. A apuração de Corumbá marca o
          crédito como indevido — em Julho/2026 foram R$ 14.424,02, a contraparte
          exata do débito de CFOP 6152 de Guará. A apuração consolidada somou
          esse valor ao crédito mantido; a individualizada, não.
        homologado: false

    isentos_de_estorno:
      - ciap
      - complemento_icms
    difal: guia_avulsa

  ms_beneficio_rio_brilhante:
    descricao: >
      Estabelecimento com benefício fiscal por Termo de Acordo. As entradas
      beneficiadas têm o crédito estornado integralmente, e o crédito presumido
      entra depois sobre o saldo devedor.
      NÃO HOMOLOGADO — é o que os números de Julho/2026 mostram (estorno de
      R$ 331.236,11 contra R$ 331.307,32 de ICMS nas entradas a 4%, resíduo de
      R$ 71,21), não uma regra escrita. Ver decisões pendentes nº 1 e nº 2.
    vigencia_inicio: 2025-01-01
    homologado: false
    formula_estorno: integral_nas_cargas
    cargas_estornadas: [4.0]
    # O complemento de ICMS NÃO entra aqui: em Julho/2026 a linha de
    # complemento de RB (R$ 5.249,34) foi estornada junto com as demais
    # entradas a 4%. Só o CIAP fica de fora.
    isentos_de_estorno:
      - ciap
    difal: guia_avulsa

  mt_diferimento:
    descricao: Saídas diferidas — estorna 100% do crédito de entrada.
    vigencia_inicio: 2025-01-01
    formula_estorno: integral
    isentos_de_estorno: [ciap]

  pr_diferimento:
    descricao: >
      Saídas diferidas — mantém 100% do crédito de entrada, que se acumula
      como saldo credor. Ver decisão pendente nº 7.
    vigencia_inicio: 2025-01-01
    formula_estorno: nenhum

beneficios_fiscais:

  ms_rio_brilhante:
    descricao: >
      Crédito presumido sobre o saldo devedor, por Termo de Acordo com o estado
      de MS. Estrutura confirmada contra Julho/2026 com 0,19% de diferença.
      Ver decisão pendente nº 1.
    vigencia_inicio: 2025-01-01
    homologado: false                      # <- não usar em produção sem resposta
    credito_presumido:
      saida_intraestadual: 67.0
      saida_interestadual: 80.0
      base: saldo_devedor
      rateio_do_credito_mantido: participacao_do_debito   # a confirmar
    controle_credito_outorgado:
      codigo_ajuste: MS090004
      descricao: Apropriação de crédito outorgado para abatimento de débitos
