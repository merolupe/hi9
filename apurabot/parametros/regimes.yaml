# Regimes de apuração por UF.
# RASCUNHO — pendente de homologação da Gerência Fiscal/Tributária.
# Fonte: aba "Pontos de Atenção" da apuração de Julho/2026 + escopo funcional v1.0.

regimes:

  sp_equilibrio_fiscal:
    descricao: >
      Mantém o crédito até a carga de saída e estorna o excedente.
      estorno = valor_contabil × (carga_efetiva_entrada − carga_saida_referencia)
    vigencia_inicio: 2025-01-01
    formula_estorno: excedente_sobre_carga_saida
    carga_saida_referencia: 4.0
    base_do_estorno: valor_contabil        # confirmado contra Julho/2026
    isentos_de_estorno:
      - materia_prima
      - produto_acabado
      - revenda
      - retorno_industrializacao
      - ciap
      - complemento_icms
      - devolucao_venda
    frete_venda_intraestadual: sem_credito # diferido/isento
    difal: conta_grafica

  ms_estorno_proporcional:
    descricao: >
      Estorno da parcela não tributada da operação: o crédito é reduzido até a
      carga de 4%, aplicando o percentual de redução sobre o VALOR DO ICMS.
      Não é a mecânica de SP — lá o estorno incide sobre o valor contábil.
      Confirmado contra a apuração individualizada de Corumbá (Empresa 9),
      aba ENTRADAS, colunas "Parcela não tributada" e "Valor ICMS a estornar".
    vigencia_inicio: 2025-01-01
    formula_estorno: proporcional_parcela_nao_tributada
    base_do_estorno: valor_icms

    # A parcela não tributada NÃO é uma tabela: é uma fórmula. O benefício
    # limita o crédito à carga de referência, e o que passa dela se estorna.
    #
    #     parcela estornada = 1 − carga_de_referencia / alíquota
    #
    # Fonte: aba ESTORNO da apuração de Rio Brilhante, tabelas "OPERAÇÃO
    # INTRAESTADUAL" e "OPERAÇÃO INTERESTADUAL", coluna "REDUÇÃO ATUAL".
    # Confere em todas as alíquotas que aparecem:
    #     4% → 0,0000   ·   7% → 0,4286   ·  12% → 0,6667
    #    17% → 0,7647   ·  18% → 0,7778   ·  19% → 0,7895
    #
    # A CHAVE É A ALÍQUOTA, NÃO A CARGA EFETIVA. Uma importação a 17% com base
    # reduzida tem carga efetiva de 4%, e mesmo assim estorna 76,47%.
    carga_de_referencia: 4.0

    # Casas decimais da parcela. 4 reproduz a apuração (0,4286 e 0,6667);
    # `null` usa a fração exata (3/7 e 2/3).
    casas_decimais_da_parcela: 4

    # Créditos que não podem ser apropriados. Não são estorno: são crédito que
    # nunca existiu, e por isso ficam em coluna própria na apuração.
    creditos_indevidos:
      - cfop: [2152]
        motivo: >
          Transferência interestadual recebida. A apuração de Corumbá marca o
          crédito como indevido, e o valor é a contraparte exata do débito de
          CFOP 6152 de Guará. A apuração consolidada somava esse valor ao
          crédito mantido; a individualizada, não.
        homologado: false

    isentos_de_estorno:
      - ciap
      - complemento_icms
    difal: guia_avulsa

  ms_beneficio_rio_brilhante:
    descricao: >
      Estabelecimento com benefício fiscal por Termo de Acordo. O estorno é o
      MESMO de Corumbá — parcela não tributada sobre o valor do ICMS, pela
      alíquota da operação. O benefício vem depois, sobre o saldo devedor da
      atividade industrial, e está em `beneficios_fiscais.ms_rio_brilhante`.
      Homologado contra o Registro de Apuração e a GIA de uma competência
      fechada — ver docs/apurabot/05-achados-julho-2026.md.
    vigencia_inicio: 2025-01-01
    homologado: true
    formula_estorno: proporcional_parcela_nao_tributada
    base_do_estorno: valor_icms
    carga_de_referencia: 4.0
    casas_decimais_da_parcela: 4
    # Só o CIAP fica fora do estorno. O complemento de ICMS é crédito
    # apropriável e acompanha a situação da nota complementada.
    isentos_de_estorno:
      - ciap
    difal: guia_avulsa

  mt_diferimento:
    descricao: Saídas diferidas — estorna 100% do crédito de entrada.
    vigencia_inicio: 2025-01-01
    formula_estorno: integral
    isentos_de_estorno: [ciap]

  pr_diferimento:
    descricao: >
      Saídas diferidas — mantém 100% do crédito de entrada, que se acumula
      como saldo credor. Ver decisão pendente nº 1.
    vigencia_inicio: 2025-01-01
    formula_estorno: nenhum

beneficios_fiscais:

  ms_rio_brilhante:
    descricao: >
      Termo de Acordo n. 1.190/2018, firmado em 19/09/2018 entre o Estado de MS
      e a Hinove, publicado no DOE 9.755. Base legal: LC estadual 93/2001 e
      Lei 4.049/2011.
    documento: Termo de Acordo n. 1.190/2018
    vigencia_inicio: 2018-09-19
    vigencia_fim: 2032-12-31          # cláusula terceira, caput
    homologado: true

    # Cláusula terceira, incisos I e II. O benefício é deduzido do saldo devedor
    # "que tenha resultado como efetiva e regularmente devido", ou seja, nunca
    # supera o próprio saldo devedor.
    credito_presumido:
      saida_intraestadual: 67.0       # inciso I
      saida_interestadual: 80.0       # inciso I + adicional de 13% do inciso II
      base: saldo_devedor_da_atividade_industrial
      limitado_ao_saldo_devedor: true

    # ALCANCE DO BENEFÍCIO
    #
    # A linha 012 do Registro de Apuração nomeia a dedução:
    #   "BENEFÍCIOS FISCAIS - Termo de acordo n. 1190/2018 -
    #    Industrialização própria - Incentivo TA/CDI"
    # e a base de saídas incentivadas da GIA - Benefício Fiscal é a dos CFOP de
    # produção própria. A leitura literal do inciso I é a que vale: o alcance é
    # a atividade industrial, não todas as saídas.
    alcance:
      criterio: atividade_industrial
      rateio_do_credito: participacao_do_debito

    # Contribuições sobre o benefício fruído. São GUIA AVULSA, calculadas na
    # própria GIA: saem no relatório como informação e NÃO entram na conta
    # gráfica da apuração.
    #
    fadefe:
      condicao_de_fruicao: true       # cláusula terceira, parágrafo primeiro
      lancamento: guia_avulsa
      percentual: 2.0                 # Pró-Desenvolve / FADEFE Desenv. / FAI
      percentual_adicional: 0.0       # Adicional FADEFE Equilíbrio Fiscal

    controle_credito_outorgado:
      codigo_ajuste: MS090004
      descricao: Apropriação de crédito outorgado para abatimento de débitos

  # Cláusula quarta do mesmo Termo. EXPIRADA — a cláusula oitava, inciso I, fixa
  # a vigência "a partir da data de sua assinatura e até 31 de dezembro de 2022".
  # Fica registrada para que uma apuração de competência antiga continue
  # reproduzível, como manda a regra de vigência do projeto.
  ms_rio_brilhante_clausula_quarta:
    descricao: >
      Crédito outorgado de 50% do saldo devedor nas saídas interestaduais com
      mercadorias adquiridas em outras UFs, e crédito presumido de 50% do
      imposto nas saídas interestaduais com itens importados.
    documento: Termo de Acordo n. 1.190/2018, cláusula quarta
    vigencia_inicio: 2018-09-19
    vigencia_fim: 2022-12-31
    aplicavel: false

# ---------------------------------------------------------------------------
# Segregação por atividade
# ---------------------------------------------------------------------------
# A GIA de Mato Grosso do Sul não aceita uma apuração só por estabelecimento:
# exige o resultado separado por atividade. E isso não é formalidade de
# declaração — é a segregação que dimensiona o benefício, porque o crédito
# presumido do Termo de Acordo incide exclusivamente sobre o saldo devedor da
# atividade industrial.
#
# Ordem de avaliação: descrição primeiro, CFOP depois. O que não casar recebe
# SEM REGRA e bloqueia o encerramento, como manda a regra 4 do projeto.
atividades:

  ms:
    descricao: >
      Colunas da GIA de MS: Industrial, Comercial, Importados e
      Prestacional/Outras.
    vigencia_inicio: 2025-01-01
    homologado: true
    fonte: >
      Registro de Apuração do ICMS e GIA de RIO BRILHANTE. Confere ao centavo em
      débito e crédito nas três atividades — ver
      docs/apurabot/05-achados-julho-2026.md.
    # ATENÇÃO: a homologação é de Rio Brilhante. Corumbá usa o mesmo mapa
    # porque a UF é a mesma, mas não há GIA de Corumbá para conferir a
    # segregação dela. Ver decisão pendente nº 6.

    # O prefixo do CFOP é a definição do próprio sistema de CFOP, não uma regra
    # com vigência. Fica aqui só para não haver número fiscal dentro do .py.
    destino_por_prefixo_cfop:
      5: intraestadual
      6: interestadual
      7: exterior

    # O CFOP do serviço de transporte diz quem contratou o frete, não o que o
    # frete carrega — e é o que ele carrega que define a atividade. Por isso a
    # descrição vence o CFOP quando casa: frete de insumo é industrial e frete
    # de venda é comercial, dentro do mesmo CFOP de serviço de transporte.
    #
    # O CRITÉRIO É CUSTO × DESPESA, confirmado pela Gerência Fiscal/Tributária
    # em 03/09/2026: frete que entra como CUSTO é produção; frete de venda, que
    # é DESPESA, é comercial. A própria descrição do CT-e no Sankhya marca isso
    # com "(Custo)" no fim — é o que estas regras leem.
    #
    #   Fretes sobre Compra de Insumos (Custo) .......... custo    → industrial
    #   Fretes sobre Transf/ Remessa/ Retorno (Custo) ... custo    → industrial
    #   Fretes sobre Vendas ............................. despesa  → comercial
    #
    #   Fretes sobre Compras (Almoxarifado) ............ despesa  → comercial
    #   Fretes sobre Transf/ Retorno - Venda conjunta .. despesa  → comercial
    #
    # As duas últimas foram respondidas em 03/09/2026: são DESPESA, não custo.
    # Ficam antes das regras de custo na lista porque a ordem é a de avaliação,
    # e "Transf/ Retorno - Venda conjunta" não pode cair na regra genérica de
    # transferência. Ver decisão pendente nº 17, respondida.
    por_descricao:
      # --- despesa: comercial ---
      - contem: Fretes sobre Compras (Almoxarifado)
        atividade: comercial
      - contem: Fretes sobre Transf/ Retorno - Venda conjunta
        atividade: comercial
      # --- custo: industrial ---
      - contem: Fretes sobre Compra de Insumos
        atividade: industrial
        cfop: [1352, 2352, 1353, 2353]
      - contem: Fretes sobre Transf/ Remessa/ Retorno
        atividade: industrial
        cfop: [1352, 2352, 1353, 2353]
        vigencia_inicio: 2026-08-01
        # VIGÊNCIA A PARTIR DE AGOSTO/2026, de propósito. A GIA de 07/2026 de
        # Rio Brilhante classificou este frete como COMERCIAL, e é contra ela
        # que a regressão de julho fecha. Aplicar o critério novo para trás
        # mudaria o que já foi declarado: R$ 4.355,07 de crédito sairiam do
        # comercial para o industrial, o estorno industrial subiria
        # R$ 1.866,58 e o benefício cairia R$ 1.946,12.
        #
        # RESPONDIDO em 03/09/2026 pela Gerência Fiscal/Tributária: julho NÃO
        # é retificado. A vigência fica.
      - contem: Fretes sobre Vendas
        atividade: comercial
        cfop: [1352, 2352, 1353, 2353]
        # Sem vigência: é o que a apuração já fazia pelo CFOP. Fica explícito
        # para o critério custo × despesa aparecer inteiro no parâmetro.

    # Os pares intra/inter andam juntos: se 5118 é industrial, 6118 também é.
    # Nada aqui é inferido do comportamento da apuração — cada CFOP está na
    # atividade que a sua própria descrição na tabela de CFOP indica.
    #
    # A devolução segue a venda que desfaz: 1201/2201/3201 é devolução de venda
    # de produção do estabelecimento e por isso é industrial; 1202/2202/3202 é
    # devolução de venda de mercadoria adquirida de terceiros, e é comercial.
    #
    # 1923/2923 é a entrada de mercadoria que a empresa recebe por transmissão
    # de propriedade em armazém — a contraparte do 5934/6934, que já é
    # comercial. Decidido pela Gerência Fiscal/Tributária: é sempre comercial,
    # independentemente do produto ou da nota de transferência referenciada.
    por_cfop:
      industrial:
        debito: [5101, 6101, 5109, 6109, 5111, 6111, 5118, 6118, 5122, 6122]
        credito: [1101, 2101, 3101, 1111, 2111, 1116, 2116, 1122, 2122,
                  1151, 2151, 3151,          # transferência p/ industrialização
                  1201, 2201, 3201]          # devolução de venda de produção
      comercial:
        debito: [5102, 6102, 5103, 6103, 5104, 6104, 5115, 6115, 5117, 6117,
                 5119, 6119, 5120, 6120, 5905, 6905, 5906, 6906, 5934, 6934]
        credito: [1102, 2102, 3102, 1113, 2113, 1118, 2118, 1121, 2121,
                  1152, 2152, 3152,          # transferência p/ comercialização
                  1202, 2202, 3202,          # devolução de venda de terceiros
                  1352, 2352, 1353, 2353, 1906, 2906, 1907, 2907,
                  1923, 2923]                # armazém: transmissão de propriedade
      prestacional_outras:
        debito: [5910, 6910, 5911, 6911, 5949, 6949]
        credito: [1604, 2604, 1949, 2949]

# ---------------------------------------------------------------------------
# DIFAL — diferencial de alíquota nas entradas de uso, consumo e ativo
# ---------------------------------------------------------------------------
# O valor já vem calculado no Livro Fiscal, na coluna `Diferença ICMS`. Ele não
# sai do ICMS do próprio lançamento: a entrada de uso e consumo escritura ICMS
# zero, porque não há crédito a tomar. O ERP calcula o DIFAL a partir do ICMS
# destacado no XML e grava o resultado nessa coluna.
#
# A conferência de 08/2026 fechou lançamento a lançamento contra a planilha
# DIFAL consolidada do time fiscal — 53 lançamentos, R$ 55.427,33 contra
# R$ 55.427,35, dois centavos de arredondamento.
#
# O que muda com a UF é o destino, não o cálculo:
#
#   na_conta_grafica: true    entra na apuração, na linha indicada do Registro
#   na_conta_grafica: false   é informativo — recolhido em guia avulsa, como
#                             o FADEFE, e por isso fora do saldo
#
# Revisão: Gerência Fiscal/Tributária | Confirmado em 02/09/2026
difal:

  sp:
    na_conta_grafica: true
    linha_do_registro: 2
    descricao: Diferencial ICMS Entrada
    homologado: true
    # Entra em cada unidade, antes de qualquer centralização: o DIFAL é da
    # unidade que fez a entrada, e é o saldo dela, já com o DIFAL, que vai ao
    # grupo. A redação é a que o Registro de Apuração do ERP usa na
    # discriminação da linha 002.

  ms:
    na_conta_grafica: false
    descricao: Diferencial de alíquota — guia avulsa
    homologado: true
    # Em MS o DIFAL não entra na conta gráfica: é recolhido em guia própria.
    # Sai informado no relatório, ao lado do FADEFE, para não se perder.
