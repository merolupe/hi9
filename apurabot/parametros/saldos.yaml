# Saldo credor do período anterior — a abertura da conta gráfica.
#
# É a linha 009 do Registro de Apuração: o crédito que o estabelecimento trouxe
# do mês passado e que se soma ao crédito do mês antes de apurar o saldo. Não
# nasce do Livro Fiscal — o Livro só tem os documentos da competência —, então
# tem que ser declarado aqui.
#
# De onde vem o número: é a **linha 014 do Registro de Apuração da competência
# anterior** ("SALDO CREDOR a Transportar p/ o Período Seguinte"). O Apurabot
# calcula essa linha 014; quando a série estiver encadeada, o valor de um mês
# sai do fechamento do anterior. Enquanto a ferramenta não tiver a série
# inteira, a abertura entra por aqui.
#
# `por_estabelecimento` é indexado pelo CODIGO da empresa (coluna G do Livro
# Fiscal), nunca pelo nome — os nomes têm espaçamento irregular na origem.
#
# CONVENÇÃO: uma competência presente neste arquivo é uma declaração COMPLETA.
# Estabelecimento que não aparece em `por_estabelecimento` abriu o mês sem saldo
# credor — e uma competência sem nenhum estabelecimento listado é a declaração
# de que ninguém abriu o mês com crédito. Competência ausente do arquivo é
# diferente disso: aí a linha 009 sai zerada e MARCADA no registro, porque
# ninguém declarou nada — é a regra 4 do repositório, que proíbe preencher por
# conta própria.
#
# Revisão: Gerência Fiscal/Tributária

saldos_credores:

  - competencia: "2026-07"
    homologado: true
    origem: >
      Linha 009 dos Registros de Apuração de 07/2026, um por estabelecimento.
      Filial Guará (empresa 11), emitido em 06/08/2026: R$ 1.782,53. Londrina
      (empresa 7), emitido em 06/08/2026: R$ 327.121,97. Matriz, Registro, Rio
      Brilhante e Corumbá abrem julho zerados — a linha 009 dos quatro
      documentos é R$ 0,00, porque fecharam junho devedores e recolheram.
    pendencia: >
      O Registro de 06/2026 da mesma filial fecha a linha 014 em R$ 0,00 — e a
      linha 009 dele também. Junho zerou porque a centralização de SP
      transferiu para Guará exatamente o crédito de que ele precisava:
      R$ 455.859,54 na linha 006 contra saldo devedor de igual valor. Ou seja,
      o que julho declara ter recebido não é o que junho declara ter
      transportado. A diferença é de R$ 1.782,53 e está nos documentos do ERP,
      não na ferramenta; vale a pena o time fiscal olhar.
    por_estabelecimento:
      11: 1782.53             # HINOVE (FILIAL GUARÁ)
      7: 327121.97            # HINOVE (LONDRINA)

  - competencia: "2026-08"
    homologado: true
    origem: >
      Linha 014 dos Registros de Apuração de 07/2026, um por estabelecimento.
      Filial Guará (empresa 11): R$ 2.215.164,28. Londrina (empresa 7):
      R$ 341.004,37 — que é o saldo credor que julho abriu (R$ 327.121,97) mais
      o crédito das entradas do próprio julho (R$ 13.882,40); PR difere a saída
      e o crédito se acumula (decisão nº 1). Matriz, Registro, Rio Brilhante e
      Corumbá fecham julho com a linha 014 em R$ 0,00 e abrem agosto zerados.
      Barra do Garças não tem Registro emitido no período.
    por_estabelecimento:
      11: 2215164.28          # HINOVE (FILIAL GUARÁ)
      7: 341004.37            # HINOVE (LONDRINA)
