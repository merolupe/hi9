# Saldo credor do período anterior — a abertura da conta gráfica.
#
# É a linha 009 do Registro de Apuração: o crédito que o estabelecimento trouxe
# do mês passado e que se soma ao crédito do mês antes de apurar o saldo. Não
# nasce do Livro Fiscal — o Livro só tem os documentos da competência —, então
# tem que ser declarado aqui.
#
# De onde vem o número: é a **linha 014 do Registro de Apuração da competência
# anterior** ("SALDO CREDOR a Transportar p/ o Período Seguinte"). O Apurabot
# calcula essa linha 014; quando a série estiver encadeada, o valor de um mês
# sai do fechamento do anterior. Enquanto a ferramenta não tiver a série
# inteira, a abertura entra por aqui.
#
# `por_estabelecimento` é indexado pelo CODIGO da empresa (coluna G do Livro
# Fiscal), nunca pelo nome — os nomes têm espaçamento irregular na origem.
#
# CONVENÇÃO: uma competência presente neste arquivo é uma declaração COMPLETA.
# Estabelecimento que não aparece em `por_estabelecimento` abriu o mês sem saldo
# credor — e uma competência sem nenhum estabelecimento listado é a declaração
# de que ninguém abriu o mês com crédito. Competência ausente do arquivo é
# diferente disso: aí a linha 009 sai zerada e MARCADA no registro, porque
# ninguém declarou nada — é a regra 4 do repositório, que proíbe preencher por
# conta própria.
#
# Revisão: Gerência Fiscal/Tributária

saldos_credores:

  - competencia: "2026-07"
    homologado: true
    origem: >
      Linha 009 dos Registros de Apuração de 07/2026, um por estabelecimento.
      Filial Guará (empresa 11), emitido em 06/08/2026: R$ 1.782,53. Londrina
      (empresa 7), emitido em 06/08/2026: R$ 327.121,97. Matriz, Registro, Rio
      Brilhante e Corumbá abrem julho zerados — a linha 009 dos quatro
      documentos é R$ 0,00, porque fecharam junho devedores e recolheram.
    pendencia: >
      O Registro de 06/2026 da mesma filial fecha a linha 014 em R$ 0,00 — e a
      linha 009 dele também. Junho zerou porque a centralização de SP
      transferiu para Guará exatamente o crédito de que ele precisava:
      R$ 455.859,54 na linha 006 contra saldo devedor de igual valor. Ou seja,
      o que julho declara ter recebido não é o que junho declara ter
      transportado. A diferença é de R$ 1.782,53 e está nos documentos do ERP,
      não na ferramenta; vale a pena o time fiscal olhar.
    por_estabelecimento:
      11: 1782.53             # HINOVE (FILIAL GUARÁ)
      7: 327121.97            # HINOVE (LONDRINA)

  - competencia: "2026-08"
    homologado: true
    origem: >
      Linha 014 dos Registros de Apuração de 07/2026, um por estabelecimento.
      Filial Guará (empresa 11), retificado em 25/09/2026: R$ 1.376.818,13 —
      o documento original fechava em R$ 2.215.164,28; a retificação acrescenta
      à linha 003 R$ 838.346,15 de "outros estornos de crédito — art. 62 do
      RICMS", e a linha 009 do Registro de agosto já abre com o valor
      retificado. Londrina (empresa 7):
      R$ 341.004,37 — que é o saldo credor que julho abriu (R$ 327.121,97) mais
      o crédito das entradas do próprio julho (R$ 13.882,40); PR difere a saída
      e o crédito se acumula (decisão nº 1). Matriz, Registro, Rio Brilhante e
      Corumbá fecham julho com a linha 014 em R$ 0,00 e abrem agosto zerados.
      Barra do Garças (empresa 8) não tem Registro de julho em mãos; a
      abertura é a linha 009 do Registro de 08/2026, emitido em 03/09/2026:
      R$ 3.014,07.
    por_estabelecimento:
      11: 1376818.13          # HINOVE (FILIAL GUARÁ)
      7: 341004.37            # HINOVE (LONDRINA)
      8: 3014.07              # HINOVE (BARRA DO GARÇAS - MT)

  - competencia: "2026-09"
    homologado: true
    origem: >
      Linha 014 dos Registros de Apuração de 08/2026, um por estabelecimento.
      Filial Guará (empresa 11), retificado em 28/09/2026: R$ 960.376,58.
      Londrina (empresa 7): R$ 379.388,66 — a abertura de agosto
      (R$ 341.004,37) mais o crédito das entradas do próprio agosto
      (R$ 38.384,29), como em julho (decisão nº 1). Barra do Garças
      (empresa 8), emitido em 03/09/2026: R$ 3.014,07 — MT difere a saída, o
      estorno leva o crédito do mês e o saldo que veio passa intacto. Matriz e
      Corumbá (emitidos em 03/09/2026) e Rio Brilhante (atualizado em
      09/09/2026) fecham agosto com a linha 014 em R$ 0,00. Registro (empresa
      4) não teve o documento anexado; fecha em zero porque SP transfere o
      saldo integral para Guará — a linha 002 de Guará recebe R$ 199.602,07
      de saldo devedor, e a Matriz não transferiu nada.
    por_estabelecimento:
      11: 960376.58           # HINOVE (FILIAL GUARÁ)
      7: 379388.66            # HINOVE (LONDRINA)
      8: 3014.07              # HINOVE (BARRA DO GARÇAS - MT)

# ---------------------------------------------------------------------------
# Saldo inicial dos créditos controlados — Registro 1200 da EFD (SLD_CRED).
# ---------------------------------------------------------------------------
# O estoque de crédito recebido por transferência de Rio Brilhante atravessa a
# competência como o saldo credor, e por isso também é declarado aqui. O valor
# é o SLD_CRED_FIM do 1200 do mês anterior; a planilha entrega o do mês
# seguinte pronto na aba REGISTRO 1200. O que é cada campo está em
# `controle_de_creditos.yaml`.
#
# Competência ausente deste bloco não é saldo zero: o 1200 abre no saldo final
# do mês anterior transmitido (bloco `creditos_controlados_transmitidos`,
# abaixo) e, sem ele, sai marcado, com o saldo inicial em aberto (regra 4 do
# repositório).
#
# `recebido_por_estabelecimento` declara o CRÉD_RECEB do mês quando o Livro
# não o traz inteiro: a NF-e de transferência vem com desconto, e o Livro só
# tem o valor do documento. Sem a declaração, vale o Livro.

creditos_controlados:

  - competencia: "2026-08"
    homologado: true
    origem: >
      SLD_CRED do Registro 1200 de Rio Brilhante de 08/2026, tela da EFD:
      R$ 108.426,33. A planilha "SPED Jan-Jul 2026 Consolidado" dava
      R$ 86.091,65 (91.845,01 + 62.720,00 − 68.473,36), R$ 22.334,68 a menos;
      vale o que a EFD de agosto abre.
    por_estabelecimento:
      2:                      # HINOVE (RIO BRILHANTE)
        MS090004: 108426.33

  - competencia: "2026-09"
    homologado: true
    origem: >
      SLD_CRED_FIM do Registro 1200 de Rio Brilhante de 08/2026, tela da EFD:
      108.426,33 + 62.720,00 recebidos por transferência − 108.858,68
      utilizados = 62.287,65. O recebido é o crédito da NF-e (62.720,00), não
      o valor contábil dela no Registro de Apuração (57.702,40, líquido do
      desconto).
    por_estabelecimento:
      2:                      # HINOVE (RIO BRILHANTE)
        MS090004: 62287.65
    # O crédito da NF-e 247431 da ADECOAGRO (CRÉD_RECEB). O Livro traz o
    # documento, 57.702,40, líquido do desconto de 8%.
    recebido_por_estabelecimento:
      2:                      # HINOVE (RIO BRILHANTE)
        MS090004: 62720.00

# ---------------------------------------------------------------------------
# O 1200 como foi transmitido — o histórico do estoque, mês a mês.
# ---------------------------------------------------------------------------
# A aba REGISTRO 1200 mostra os meses já transmitidos do ano, acima do mês em
# apuração: é o histórico que explica o saldo transportado. Cada mês traz os
# campos do 1200 da EFD entregue; o SLD_CRED_FIM é a conta, não se declara.
#
# Quando a competência não tem saldo inicial no bloco `creditos_controlados`,
# ele sai do SLD_CRED_FIM do mês anterior declarado aqui. Para abrir outubro,
# basta incluir setembro depois de transmitido.

creditos_controlados_transmitidos:

  - empresa: 2                          # HINOVE (RIO BRILHANTE)
    cod_aj_apur: MS090004
    origem: >
      EFD de 01 a 07/2026 (planilha "SPED Jan-Jul 2026 Consolidado", com o
      julho retificado: 46.138,68 utilizados) e a tela do 1200 de 08/2026.
    meses:
      "2026-01": { sld_cred: 0.00,      cred_receb: 62720.00, cred_util: 62720.00 }
      "2026-02": { sld_cred: 0.00,      cred_receb: 62720.00, cred_util: 42450.48 }
      "2026-03": { sld_cred: 20269.52,  cred_receb: 62720.00, cred_util: 82989.52 }
      "2026-04": { sld_cred: 0.00,      cred_receb: 62720.00, cred_util: 10168.81 }
      "2026-05": { sld_cred: 52551.19,  cred_receb: 62720.00, cred_util: 67288.96 }
      "2026-06": { sld_cred: 47982.23,  cred_receb: 62720.00, cred_util: 18857.22 }
      "2026-07": { sld_cred: 91845.01,  cred_receb: 62720.00, cred_util: 46138.68 }
      "2026-08": { sld_cred: 108426.33, cred_receb: 62720.00, cred_util: 108858.68 }
