<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central Fiscal — Hinove Agrociência</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f3864'/%3E%3Ctext x='16' y='23' font-size='19' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
<style>
:root{
  --fundo:#f4f6fa; --painel:#ffffff; --texto:#16202e; --suave:#5b6b80;
  --borda:#dde3ec; --marca:#1f3864; --marca-clara:#e8eef8;
  --ok:#1e7b34; --ok-fundo:#e7f5ea; --erro:#b00020; --erro-fundo:#fdecef;
  --atencao:#9a6b00; --atencao-fundo:#fff6e0;
}
@media (prefers-color-scheme: dark){
  :root{
    --fundo:#11151c; --painel:#182029; --texto:#e8edf4; --suave:#9aabc0;
    --borda:#2a3542; --marca:#7ea6e8; --marca-clara:#1d2836;
    --ok:#6ede8a; --ok-fundo:#16301d; --erro:#ff8095; --erro-fundo:#341219;
    --atencao:#ffce6a; --atencao-fundo:#33280d;
  }
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--fundo); color:var(--texto);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
.envelope{max-width:1080px; margin:0 auto; padding:28px 20px 80px}
header{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:6px}
h1{font-size:26px; margin:0; letter-spacing:-.3px}
h1 span{color:var(--marca)}
.subtitulo{color:var(--suave); font-size:14.5px; margin:0 0 26px}
.oculto{display:none !important}
code{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.92em}

/* ---------- menu de ferramentas ---------- */
.grade{display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.cartao{
  background:var(--painel); border:1px solid var(--borda); border-radius:12px;
  padding:18px 20px; text-align:left; width:100%; display:flex; gap:15px;
  align-items:flex-start; font:inherit; color:inherit; cursor:pointer;
  transition:border-color .15s, background .15s, transform .1s;
}
.cartao:hover{border-color:var(--marca); background:var(--marca-clara)}
.cartao:active{transform:translateY(1px)}
.cartao[disabled]{cursor:default; opacity:.55}
.cartao[disabled]:hover{border-color:var(--borda); background:var(--painel)}
.cartao .icone{font-size:27px; line-height:1.1}
.cartao .nome{font-weight:700; font-size:17px; margin-bottom:3px}
.cartao .resumo{color:var(--suave); font-size:14px}
.cartao .detalhe{color:var(--suave); font-size:13px; margin-top:7px; font-style:italic}
.etiqueta{
  display:inline-block; font-size:11px; font-weight:700; letter-spacing:.5px;
  padding:2px 8px; border-radius:20px; margin-left:8px; vertical-align:2px;
  background:var(--atencao-fundo); color:var(--atencao); text-transform:uppercase;
}

/* ---------- tela da ferramenta ---------- */
.voltar{
  background:none; border:none; color:var(--suave); font:inherit; cursor:pointer;
  padding:0; margin-bottom:18px; font-size:14.5px;
}
.voltar:hover{color:var(--texto)}
#largar{
  background:var(--painel); border:2px dashed var(--borda); border-radius:14px;
  padding:52px 28px; text-align:center; cursor:pointer;
  transition:border-color .15s, background .15s;
}
#largar:hover,#largar.sobre{border-color:var(--marca); background:var(--marca-clara)}
#largar .icone{font-size:42px; line-height:1; margin-bottom:14px}
#largar .principal{font-size:19px; font-weight:600; margin-bottom:6px}
#largar .apoio{color:var(--suave); font-size:14.5px}
#arquivo{display:none}
/* Com arquivos já anexados, a caixa encolhe e o quadro sobe para a vista. */
#largar.compacto{padding:18px 24px}
#largar.compacto .icone,#largar.compacto .apoio{display:none}
#largar.compacto .principal{font-size:16px; margin:0}

section{
  background:var(--painel); border:1px solid var(--borda); border-radius:12px;
  padding:20px 22px; margin-bottom:18px;
}
section > h2{
  font-size:13px; text-transform:uppercase; letter-spacing:.7px;
  color:var(--suave); margin:0 0 14px; font-weight:700;
}
.faixa{
  border-radius:12px; padding:16px 20px; margin-bottom:20px;
  display:flex; align-items:center; gap:12px; font-weight:600;
}
.faixa.ok{background:var(--ok-fundo); color:var(--ok)}
.faixa.erro{background:var(--erro-fundo); color:var(--erro)}
.faixa .marca{font-size:22px}
.fichas{display:flex; flex-wrap:wrap; gap:30px}
.ficha .rotulo{font-size:12.5px; color:var(--suave); text-transform:uppercase; letter-spacing:.5px}
.ficha .valor{font-size:23px; font-weight:600; font-variant-numeric:tabular-nums}
ul.lista{margin:0; padding-left:20px; font-size:14px}
ul.lista li{margin-bottom:5px; word-break:break-all}
ul.lista.erro li{color:var(--erro)}
.corte{color:var(--suave); font-size:13.5px; margin:10px 0 0}
#processando{
  background:var(--painel); border:1px solid var(--borda); border-radius:14px;
  padding:44px 28px; text-align:center;
}
.girando{
  width:34px; height:34px; margin:0 auto 16px; border-radius:50%;
  border:3px solid var(--borda); border-top-color:var(--marca);
  animation:girar .8s linear infinite;
}
@keyframes girar{to{transform:rotate(360deg)}}
button.acao{
  font:inherit; font-weight:600; cursor:pointer; border-radius:9px;
  border:1px solid transparent; padding:11px 20px;
}
.principal-btn{background:var(--marca); color:#fff}
.principal-btn:hover{filter:brightness(1.12)}
.principal-btn[disabled]{opacity:.5; cursor:default; filter:none}
.secundario-btn{background:transparent; color:var(--suave); border-color:var(--borda)}
.secundario-btn:hover{color:var(--texto); border-color:var(--suave)}
.acoes{display:flex; gap:12px; flex-wrap:wrap; margin:20px 0 4px}
.rodape{color:var(--suave); font-size:13px; margin-top:34px; text-align:center}

/* ---------- quadro dos relatórios anexados ---------- */
#quadro{margin-top:18px}
.documento{
  display:flex; gap:12px; align-items:flex-start; padding:11px 2px;
  border-bottom:1px solid var(--borda);
}
.documento:last-child{border-bottom:none}
.documento .sinal{
  flex:0 0 26px; height:26px; border-radius:50%; display:flex;
  align-items:center; justify-content:center; font-weight:700; font-size:14px;
  border:2px solid var(--borda); color:var(--suave);
}
.documento.ok .sinal{background:var(--ok-fundo); border-color:var(--ok); color:var(--ok)}
.documento.falta .sinal{border-color:var(--erro); color:var(--erro); border-style:dashed}
.documento.repetido .sinal{background:var(--atencao-fundo); border-color:var(--atencao); color:var(--atencao)}
.documento.solto .sinal{border-color:var(--suave)}
.documento.solto.bloqueia .sinal{background:var(--erro-fundo); border-color:var(--erro); color:var(--erro)}
.documento .corpo{flex:1; min-width:0}
.documento .titulo{font-weight:600}
.documento .situacao{font-size:13.5px; color:var(--suave)}
.documento.falta .situacao{color:var(--erro)}
.documento.repetido .situacao{color:var(--atencao)}
.documento.solto.bloqueia .situacao{color:var(--erro)}
.selo{
  font-size:10.5px; font-weight:700; letter-spacing:.4px; text-transform:uppercase;
  padding:1px 7px; border-radius:20px; margin-left:6px; vertical-align:1px;
  background:var(--marca-clara); color:var(--suave);
}
.anexo{display:flex; align-items:center; gap:4px; font-size:14px; word-break:break-all}
.anexo::before{content:"📄"; margin-right:4px}
.pendencias{margin:14px 0 0; padding-left:20px; font-size:14px; color:var(--erro)}
.pendencias li{margin-bottom:4px}

/* ---------- tela de configuração ---------- */
.explicacao{color:var(--suave); font-size:14px; margin:-6px 0 14px}
.rolagem{overflow-x:auto; margin:0 -4px}
table.grade-config{border-collapse:collapse; font-size:13px}
table.grade-config th{
  font-size:11.5px; text-transform:uppercase; letter-spacing:.3px; text-align:left;
  color:var(--suave); border-bottom:2px solid var(--borda); font-weight:700;
  padding:5px 4px; white-space:nowrap; cursor:help;
}
table.grade-config td{padding:2px 3px; border-bottom:1px solid var(--borda)}
table.grade-config input[type=text]{
  font:inherit; font-size:13px; padding:4px 6px; border-radius:6px;
  border:1px solid var(--borda); background:var(--fundo); color:var(--texto);
}
table.grade-config input[type=text]:focus{outline:2px solid var(--marca); outline-offset:-1px}
table.grade-config tr.alterada input[type=text]{border-color:var(--marca)}
.remover{
  background:none; border:none; color:var(--suave); cursor:pointer;
  font-size:15px; padding:2px 6px; line-height:1;
}
.remover:hover{color:var(--erro)}
.filtro{
  font:inherit; font-size:13.5px; padding:6px 10px; border-radius:8px;
  border:1px solid var(--borda); background:var(--fundo); color:var(--texto);
  margin-bottom:10px; width:280px; max-width:100%;
}
.contagem{color:var(--suave); font-size:13px; margin-left:10px}
ul.problemas{margin:0; padding-left:20px; font-size:14px}
ul.problemas li{margin-bottom:5px}
ul.problemas li.erro{color:var(--erro)}
ul.problemas li.aviso{color:var(--atencao)}
.barra-salvar{
  position:sticky; bottom:0; background:var(--fundo); padding:14px 0 6px;
  border-top:1px solid var(--borda); display:flex; gap:12px; align-items:center;
  flex-wrap:wrap;
}
</style>
</head>
<body>
<div class="envelope">

  <header><h1>Central <span>Fiscal</span></h1></header>
  <p class="subtitulo">Ferramentas do time Fiscal/Tributário — Hinove Agrociência S.A.</p>

  <!-- ================= menu ================= -->
  <div id="menu">
    <div class="grade" id="grade"></div>
  </div>

  <!-- ================= ferramenta escolhida ================= -->
  <div id="tela" class="oculto">
    <button class="voltar" onclick="aoMenu()">← Ferramentas</button>
    <h2 id="tela-nome" style="margin:0 0 4px; font-size:21px"></h2>
    <p class="subtitulo" id="tela-resumo"></p>
    <div class="acoes" id="tela-acoes" style="margin-top:0"></div>

    <div id="entrada">
      <div id="largar">
        <div class="icone">📂</div>
        <div class="principal" id="largar-rotulo"></div>
        <div class="apoio" id="largar-apoio"></div>
        <input type="file" id="arquivo">
      </div>
      <div id="escolhidos" class="oculto"></div>
      <div id="quadro" class="oculto"></div>
    </div>

    <div id="processando" class="oculto">
      <div class="girando"></div>
      <div><strong id="processando-verbo"></strong></div>
    </div>

    <div id="erro" class="oculto">
      <div class="faixa erro"><span class="marca">✕</span><span>Não deu certo</span></div>
      <section><pre id="erro-texto" style="white-space:pre-wrap; margin:0; font-size:14px"></pre></section>
      <div class="acoes"><button class="acao secundario-btn" onclick="recomecar()">Tentar de novo</button></div>
    </div>

    <div id="resultado" class="oculto"></div>
  </div>

  <!-- ================= configuração da ferramenta ================= -->
  <div id="config" class="oculto">
    <button class="voltar" onclick="daConfigAoMenu()">← Ferramentas</button>
    <h2 id="config-nome" style="margin:0 0 4px; font-size:21px"></h2>
    <p class="subtitulo" id="config-resumo"></p>
    <div id="config-recado"></div>
    <div id="config-secoes"></div>
    <div class="barra-salvar">
      <button class="acao principal-btn" onclick="salvarConfig()">Salvar alterações</button>
      <button class="acao secundario-btn" onclick="carregarConfig(atual.id)">Descartar</button>
      <span class="contagem" id="config-carimbo"></span>
    </div>
  </div>

  <p class="rodape">
    Roda na sua máquina. Nada é enviado para fora.
    <button class="acao secundario-btn" style="padding:4px 12px; font-size:13px; margin-left:8px"
            onclick="encerrar()">Encerrar</button>
  </p>
</div>

<script>
const CHAVE = new URLSearchParams(location.search).get("chave") || "";
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const url = (rota, extra) => `${rota}?chave=${encodeURIComponent(CHAVE)}${extra || ""}`;

let FERRAMENTAS = [];
let atual = null;          // a ferramenta aberta
let enviados = [];         // nomes já entregues ao servidor
let ocupado = false;
let QUADRO = null;         // a conferência dos anexos, quando a ferramenta confere

// ---------- menu ----------

async function carregar(){
  const r = await fetch(url("/ferramentas"));
  const dados = await r.json();
  FERRAMENTAS = dados.ferramentas;
  $("grade").innerHTML = FERRAMENTAS.map(cartao).join("");
}

function cartao(f){
  const aImportar = f.estado === "a_importar";
  const etiqueta = aImportar ? '<span class="etiqueta">a importar</span>'
                 : f.estado === "janela" ? '<span class="etiqueta">janela própria</span>' : "";
  return `
    <button class="cartao" ${aImportar ? "disabled" : ""} onclick="escolher('${f.id}')">
      <span class="icone">${esc(f.icone)}</span>
      <span>
        <span class="nome">${esc(f.nome)}${etiqueta}</span>
        <div class="resumo">${esc(f.resumo)}</div>
        ${f.detalhe ? `<div class="detalhe">${esc(f.detalhe)}</div>` : ""}
      </span>
    </button>`;
}

// ---------- abrir uma ferramenta ----------

async function escolher(id){
  const f = FERRAMENTAS.find((x) => x.id === id);
  if (!f || f.estado === "a_importar") return;

  if (f.estado === "janela"){
    const r = await fetch(url("/abrir", `&ferramenta=${id}`));
    const dados = await r.json();
    if (dados.erro) return alert(dados.erro);
    window.open(dados.endereco, "_blank");
    return;
  }

  atual = f;
  enviados = [];
  $("tela-nome").textContent = f.nome;
  $("tela-resumo").textContent = f.resumo;
  $("tela-acoes").innerHTML = f.tem_configuracao
    ? `<button class="acao secundario-btn" onclick="carregarConfig('${f.id}')"
         title="${esc(f.resumo_da_configuracao)}">⚙ Regras e parâmetros</button>` : "";
  $("largar-rotulo").textContent = f.entrada.rotulo;
  // O texto de apoio vem do catálogo do próprio repositório, não de quem usa.
  $("largar-apoio").innerHTML = f.entrada.apoio;
  $("processando-verbo").textContent = f.verbo;
  const campo = $("arquivo");
  campo.accept = f.entrada.extensoes.join(",");
  campo.multiple = !!f.entrada.varios;
  campo.value = "";
  $("escolhidos").classList.add("oculto");
  $("quadro").classList.add("oculto");
  $("largar").classList.remove("compacto");
  QUADRO = null;
  mostrar("entrada");
  $("menu").classList.add("oculto");
  $("tela").classList.remove("oculto");
  if (f.confere) atualizarQuadro();
}

function aoMenu(){
  if (ocupado) return;
  if (atual) fetch(url("/limpar", `&ferramenta=${atual.id}`));
  atual = null; enviados = []; QUADRO = null;
  $("tela").classList.add("oculto");
  $("menu").classList.remove("oculto");
}

// ---------- configuração da ferramenta ----------

let CONFIG = null;          // {secoes, dados} da ferramenta aberta

async function carregarConfig(id){
  const f = FERRAMENTAS.find((x) => x.id === id);
  if (!f || !f.tem_configuracao) return;
  atual = f;
  const r = await fetch(url("/configuracao", `&ferramenta=${id}`));
  const dados = await r.json();
  if (dados.erro){ alert(dados.erro); return; }
  CONFIG = {secoes: dados.secoes, dados: dados.dados};
  $("config-nome").textContent = `Configuração — ${f.nome}`;
  $("config-resumo").textContent = dados.resumo;
  $("config-recado").innerHTML = "";
  desenharSecoes();
  $("menu").classList.add("oculto");
  $("tela").classList.add("oculto");
  $("config").classList.remove("oculto");
  window.scrollTo(0, 0);
}

function daConfigAoMenu(){
  CONFIG = null; atual = null;
  $("config").classList.add("oculto");
  $("menu").classList.remove("oculto");
}

function desenharSecoes(){
  $("config-secoes").innerHTML = CONFIG.secoes.map(secaoHtml).join("");
}

function secaoHtml(secao){
  const linhas = CONFIG.dados[secao.id] || [];
  const filtro = !secao.fixa && linhas.length > 10
    ? `<input class="filtro" placeholder="filtrar…" oninput="filtrar('${secao.id}', this.value)">
       <span class="contagem" id="conta-${secao.id}">${linhas.length} linha(s)</span>`
    : "";
  const acrescentar = secao.fixa ? "" :
    `<button class="acao secundario-btn" style="margin-top:12px; padding:7px 14px; font-size:13.5px"
             onclick="acrescentarLinha('${secao.id}')">+ acrescentar linha</button>`;
  return `
    <section id="secao-${secao.id}">
      <h2>${esc(secao.titulo)}</h2>
      <p class="explicacao">${esc(secao.explicacao)}</p>
      ${filtro}
      <div class="rolagem">
        <table class="grade-config">
          <thead><tr>
            ${secao.campos.map((c) =>
              `<th title="${esc(c.ajuda)}">${esc(c.rotulo)}</th>`).join("")}
            ${secao.fixa ? "" : "<th></th>"}
          </tr></thead>
          <tbody id="corpo-${secao.id}">
            ${linhas.map((l, i) => linhaHtml(secao, l, i)).join("")}
          </tbody>
        </table>
      </div>
      ${acrescentar}
    </section>`;
}

function linhaHtml(secao, linha, i){
  const celulas = secao.campos.map((c) => {
    const v = linha[c.chave];
    if (c.tipo === "booleano"){
      return `<td style="text-align:center"><input type="checkbox" ${v ? "checked" : ""}
        onchange="mudou('${secao.id}',${i},'${c.chave}',this.checked)"></td>`;
    }
    return `<td><input type="text" style="width:${c.largura}ch"
      value="${esc(v === null || v === undefined ? "" : v)}"
      title="${esc(c.ajuda)}"
      oninput="mudou('${secao.id}',${i},'${c.chave}',this.value)"></td>`;
  }).join("");
  const remover = secao.fixa ? "" :
    `<td><button class="remover" title="remover esta linha"
        onclick="removerLinha('${secao.id}',${i})">✕</button></td>`;
  return `<tr>${celulas}${remover}</tr>`;
}

function mudou(secaoId, i, chave, valor){
  CONFIG.dados[secaoId][i][chave] = valor;
  const corpo = $(`corpo-${secaoId}`);
  if (corpo && corpo.rows[i]) corpo.rows[i].classList.add("alterada");
}

function acrescentarLinha(secaoId){
  const secao = CONFIG.secoes.find((s) => s.id === secaoId);
  const nova = {};
  for (const c of secao.campos) nova[c.chave] = c.tipo === "booleano" ? true : "";
  (CONFIG.dados[secaoId] = CONFIG.dados[secaoId] || []).push(nova);
  desenharSecoes();
  const corpo = $(`corpo-${secaoId}`);
  if (corpo && corpo.lastElementChild) corpo.lastElementChild.scrollIntoView({block:"center"});
}

function removerLinha(secaoId, i){
  CONFIG.dados[secaoId].splice(i, 1);
  desenharSecoes();
}

function filtrar(secaoId, texto){
  const alvo = texto.trim().toLowerCase();
  const corpo = $(`corpo-${secaoId}`);
  if (!corpo) return;
  let visiveis = 0;
  for (const linha of corpo.rows){
    const casa = !alvo || linha.textContent.toLowerCase().includes(alvo) ||
      [...linha.querySelectorAll("input[type=text]")]
        .some((i) => i.value.toLowerCase().includes(alvo));
    linha.hidden = !casa;
    if (casa) visiveis++;
  }
  const conta = $(`conta-${secaoId}`);
  if (conta) conta.textContent = `${visiveis} linha(s)`;
}

async function salvarConfig(){
  if (!CONFIG || !atual) return;
  const r = await fetch(url("/configuracao", `&ferramenta=${atual.id}`), {
    method: "POST",
    body: JSON.stringify({dados: CONFIG.dados, responsavel: ""}),
  });
  const resposta = await r.json();
  if (resposta.erro){ mostrarProblemas(false, [{gravidade:"erro", onde:"Base", mensagem:resposta.erro}]); return; }
  mostrarProblemas(resposta.gravou, resposta.problemas || []);
  if (resposta.gravou) carregarConfig(atual.id).then(() => {
    mostrarProblemas(true, resposta.problemas || []);
  });
}

function mostrarProblemas(gravou, problemas){
  const erros = problemas.filter((p) => p.gravidade === "erro");
  const faixa = gravou
    ? `<div class="faixa ok"><span class="marca">✓</span><span>Base gravada.</span></div>`
    : `<div class="faixa erro"><span class="marca">✕</span><span>Nada foi gravado:
        ${erros.length} problema(s) impedem.</span></div>`;
  const lista = problemas.length ? `
    <section><h2>Conferência da base</h2>
      <ul class="problemas">${problemas.map((p) =>
        `<li class="${p.gravidade}"><strong>${esc(p.onde)}</strong> — ${esc(p.mensagem)}</li>`
      ).join("")}</ul></section>` : "";
  $("config-recado").innerHTML = faixa + lista;
  window.scrollTo(0, 0);
}

function mostrar(qual){
  for (const bloco of ["entrada", "processando", "erro", "resultado"])
    $(bloco).classList.toggle("oculto", bloco !== qual);
}

function recomecar(){
  enviados = [];
  $("arquivo").value = "";
  $("escolhidos").classList.add("oculto");
  mostrar("entrada");
  // Com conferência, os anexos que não rodaram continuam lá: a pessoa troca
  // só o que precisa. Depois de uma execução bem-sucedida o quadro volta vazio.
  if (atual && atual.confere) atualizarQuadro();
}

// ---------- receber os arquivos ----------

const largar = $("largar");
largar.addEventListener("click", () => $("arquivo").click());
largar.addEventListener("dragover", (e) => {
  e.preventDefault(); largar.classList.add("sobre");
});
largar.addEventListener("dragleave", () => largar.classList.remove("sobre"));
largar.addEventListener("drop", (e) => {
  e.preventDefault(); largar.classList.remove("sobre");
  receber(e.dataTransfer.files);
});
$("arquivo").addEventListener("change", (e) => receber(e.target.files));

async function receber(lista){
  if (!atual || ocupado || !lista.length) return;
  ocupado = true;
  $("processando-verbo").textContent = "Recebendo os arquivos…";
  mostrar("processando");
  try{
    for (const arquivo of lista){
      const r = await fetch(url("/enviar", `&ferramenta=${atual.id}` +
                                 `&nome=${encodeURIComponent(arquivo.name)}`),
                            {method:"POST", body:arquivo});
      const dados = await r.json();
      if (dados.erro){ falhar(dados.erro); return; }
      enviados = dados.arquivos;
    }
  } catch (e){
    falhar("A janela perdeu contato com a ferramenta. Ela ainda está aberta?");
    return;
  } finally {
    ocupado = false;
  }
  $("arquivo").value = "";
  if (atual.confere){ atualizarQuadro(); return; }
  listarEscolhidos();
  executar();
}

// ---------- o quadro: o que já veio e o que falta ----------

async function atualizarQuadro(){
  if (!atual) return;
  const ferramenta = atual.id;
  ocupado = true;
  $("processando-verbo").textContent = "Conferindo os arquivos…";
  mostrar("processando");
  try{
    const r = await fetch(url("/conferir", `&ferramenta=${ferramenta}`));
    const dados = await r.json();
    if (!atual || atual.id !== ferramenta) return;
    if (dados.erro){ falhar(dados.erro); return; }
    QUADRO = dados;
    desenharQuadro();
    mostrar("entrada");
  } catch (e){
    falhar("A janela perdeu contato com a ferramenta. Ela ainda está aberta?");
  } finally {
    ocupado = false;
  }
}

function anexoHtml(a){
  return `<div class="anexo"><span>${esc(a.nome)}</span>
    <button class="remover" title="tirar este arquivo"
            onclick="removerAnexo(${a.indice})">✕</button></div>`;
}

function documentoHtml(d){
  const sinal = {ok:"✓", falta:"!", opcional:"–", repetido:"2"}[d.estado];
  const selo = d.obrigatorio ? "" : '<span class="selo">opcional</span>';
  const situacao = {
    ok: "",
    falta: "falta anexar",
    opcional: "não veio — entra se houver",
    repetido: "dois arquivos para o mesmo relatório — tire um",
  }[d.estado];
  return `
    <div class="documento ${d.estado}">
      <span class="sinal">${sinal}</span>
      <div class="corpo">
        <div class="titulo">${esc(d.rotulo)}${selo}</div>
        ${d.anexos.map(anexoHtml).join("")}
        ${situacao ? `<div class="situacao">${situacao}</div>` : ""}
      </div>
    </div>`;
}

function soltoHtml(a){
  return `
    <div class="documento solto ${a.bloqueia ? "bloqueia" : ""}">
      <span class="sinal">${a.bloqueia ? "✕" : "?"}</span>
      <div class="corpo">
        ${anexoHtml(a)}
        <div class="situacao">${esc(a.problema)}${a.bloqueia ? ""
          : " — fica de fora da execução"}</div>
      </div>
    </div>`;
}

function desenharQuadro(){
  const q = QUADRO;
  const prontos = q.documentos.filter((d) => d.estado === "ok").length;
  const soltos = q.soltos.length ? `
    <section><h2>Arquivos que não são nenhum dos relatórios</h2>
      ${q.soltos.map(soltoHtml).join("")}</section>` : "";
  const pendencias = q.pendencias.length
    ? `<ul class="pendencias">${q.pendencias.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>`
    : "";
  const algum = q.documentos.some((d) => d.anexos.length) || q.soltos.length;
  $("largar").classList.toggle("compacto", !!algum);
  $("largar-rotulo").textContent = algum
    ? "Arraste mais relatórios, ou clique para escolher"
    : atual.entrada.rotulo;
  $("quadro").innerHTML = `
    <section><h2>Relatórios — ${prontos} de ${q.documentos.length} anexados</h2>
      ${q.documentos.map(documentoHtml).join("")}
      ${pendencias}
      <div class="acoes">
        <button class="acao principal-btn" ${q.pronta ? "" : "disabled"}
                onclick="executar()">Gerar planilha</button>
        ${algum ? `<button class="acao secundario-btn" onclick="limparAnexos()">
                     Tirar todos</button>` : ""}
      </div>
    </section>
    ${soltos}`;
  $("quadro").classList.remove("oculto");
}

async function removerAnexo(indice){
  if (!atual || ocupado) return;
  await fetch(url("/remover", `&ferramenta=${atual.id}&indice=${indice}`));
  atualizarQuadro();
}

async function limparAnexos(){
  if (!atual || ocupado) return;
  await fetch(url("/limpar", `&ferramenta=${atual.id}`));
  atualizarQuadro();
}

function listarEscolhidos(){
  $("escolhidos").innerHTML = `
    <section><h2>Recebido</h2>
      <ul class="lista">${enviados.map((n) => `<li>${esc(n)}</li>`).join("")}</ul>
    </section>`;
  $("escolhidos").classList.remove("oculto");
}

// ---------- rodar ----------

async function executar(){
  if (!atual || ocupado) return;
  ocupado = true;
  $("processando-verbo").textContent = atual.verbo;
  mostrar("processando");
  try{
    const r = await fetch(url("/executar", `&ferramenta=${atual.id}`), {method:"POST"});
    const dados = await r.json();
    if (dados.erro){ falhar(dados.erro); return; }
    desenhar(dados);
  } catch (e){
    falhar("A janela perdeu contato com a ferramenta. Ela ainda está aberta?");
  } finally {
    ocupado = false;
  }
}

function falhar(mensagem){
  ocupado = false;
  $("erro-texto").textContent = mensagem;
  mostrar("erro");
}

const TETO_DA_LISTA = 50;

function desenhar(d){
  const fichas = d.fichas.map((f) => `
    <div class="ficha"><div class="rotulo">${esc(f.rotulo)}</div>
      <div class="valor">${esc(f.valor)}</div></div>`).join("");

  const listas = d.listas.map((l) => {
    const itens = l.itens.slice(0, TETO_DA_LISTA)
      .map((i) => `<li>${esc(i)}</li>`).join("");
    const corte = l.itens.length > TETO_DA_LISTA
      ? `<p class="corte">… e mais ${l.itens.length - TETO_DA_LISTA}.</p>` : "";
    return `<section><h2>${esc(l.titulo)} — ${l.itens.length}</h2>
      <ul class="lista ${l.tom === "erro" ? "erro" : ""}">${itens}</ul>${corte}</section>`;
  }).join("");

  $("resultado").innerHTML = `
    <div class="faixa ok"><span class="marca">✓</span><span>${esc(d.titulo)}</span></div>
    ${fichas ? `<section><h2>Resumo</h2><div class="fichas">${fichas}</div></section>` : ""}
    ${listas}
    <div class="acoes">
      ${d.planilha ? `<button class="acao principal-btn" onclick="baixar()">
        ⬇ Baixar ${esc(d.planilha)}</button>` : ""}
      <button class="acao secundario-btn" onclick="recomecar()">Rodar outro lote</button>
      <button class="acao secundario-btn" onclick="aoMenu()">Voltar às ferramentas</button>
    </div>`;
  mostrar("resultado");
}

function baixar(){ location.href = url("/baixar"); }

async function encerrar(){
  await fetch(url("/encerrar"));
  document.body.innerHTML =
    '<div class="envelope"><p class="rodape">Central encerrada. ' +
    'Pode fechar esta aba.</p></div>';
}

carregar();
</script>
</body>
</html>
