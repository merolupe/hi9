<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Central Fiscal Reel</title>
<meta name="description" content="45 segundos de motion design da Central Fiscal — renderizado quadro a quadro a partir deste mesmo arquivo." />
<style>
  :root{color-scheme:dark;--bg:#07090E;--ink:#F3F5F9;--ink-2:#9AA3B3;--line:#2B323F;--acc:#35C285}
  html,body{height:100%}
  body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:500 12px/1.5 "JetBrains Mono",ui-monospace,Consolas,monospace}
  #stage{position:relative;box-sizing:border-box;height:100%;padding-inline:16px;display:grid;place-items:center;background:var(--bg)}
  #c{display:block;width:100%;height:100%;object-fit:contain;cursor:pointer}
  #gate{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:14px;border:0;
    padding:56px 16px max(24px,5vh);background:linear-gradient(to top,rgba(7,9,14,.6) 35%,rgba(7,9,14,0));color:var(--ink);cursor:pointer;
    font:inherit;letter-spacing:.18em;text-transform:uppercase}
  #gate[hidden]{display:none}
  #gate .btn{display:grid;place-items:center;width:48px;height:48px;border:1px solid var(--line);background:var(--bg);color:var(--acc)}
  #gate .btn svg{width:16px;height:16px}
</style>
</head>
<body>
<main id="stage">
  <canvas id="c" width="1920" height="1080" aria-label="Central Fiscal — reel"></canvas>
  <button id="gate" type="button"><span class="btn" aria-hidden="true"><svg viewBox="0 0 18 18"><path d="M4 2.5v13l11-6.5z" fill="currentColor"/></svg></span><span>Reproduzir com som · 45 s</span></button>
</main>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="thr" color-interpolation-filters="sRGB">
    <feComponentTransfer>
      <feFuncR type="linear" slope="2.3" intercept="-1.3"/>
      <feFuncG type="linear" slope="2.3" intercept="-1.3"/>
      <feFuncB type="linear" slope="2.3" intercept="-1.3"/>
    </feComponentTransfer>
  </filter>
</svg>
<audio id="au" src="trilha.mp3" preload="auto"></audio>
<script src="js/core.js"></script>
<script src="js/scene-open.js"></script>
<script src="js/scene-system.js"></script>
<script src="js/scene-tools.js"></script>
<script src="js/scene-end.js"></script>
<script src="js/main.js"></script>
</body>
</html>
